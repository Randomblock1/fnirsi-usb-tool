[package]
name = "fnirsi-gui"
version = "0.1.0"
edition = "2024"
description = "FNIRSI USB power meter native GUI"

[features]
default = []
parquet = ["fnirsi-protocol/parquet"]

[dependencies]
fnirsi-protocol = { path = "../fnirsi-protocol" }
eframe = "0.33"
egui_plot = "0.34"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.17"
csv = "1"
serde_json = "1"
anyhow = "1.0"
humantime = "2"

[lints]
workspace = true

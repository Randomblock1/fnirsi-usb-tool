[package]
name = "fnirsi-cli"
version = "0.1.0"
edition = "2024"
description = "FNIRSI USB power meter CLI tool"

[features]
default = []
parquet = ["fnirsi-protocol/parquet"]

[dependencies]
fnirsi-protocol = { path = "../fnirsi-protocol" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
indicatif = "0.18"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
anyhow = "1"
hidapi = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lazy_static = "1.5"
humantime = "2"

[lints]
workspace = true

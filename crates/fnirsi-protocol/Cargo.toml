[package]
name = "fnirsi-protocol"
version = "0.1.0"
edition = "2024"
description = "FNIRSI USB power meter protocol library"

[features]
default = []
parquet = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet"]

[dependencies]
hidapi = "2"
btleplug = "0.12"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc = "3"
thiserror = "2"
tracing = "0.1"
uuid = "1"
futures-util = "0.3"
anyhow = "1.0"
csv = "1.4"
rust_xlsxwriter = "0.94"
calamine = "0.34"
arrow-array = { version = "58", optional = true }
arrow-schema = { version = "58", optional = true }
parquet = { version = "58", features = ["arrow"], optional = true }

[lints]
workspace = true
